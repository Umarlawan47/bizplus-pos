<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizPlus POS — Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-brand">
      <div class="brand-mark">B+</div>
      <h1>BizPlus</h1>
      <p>Smart POS & business management for growing businesses.</p>
      <div class="feature-pills">
        <span>Sales</span><span>Inventory</span><span>Profit</span><span>Customers</span>
      </div>
    </section>

    <section class="auth-card">
      <div id="loginView">
        <h2>Welcome back</h2>
        <p class="muted">Sign in to continue to your business.</p>
        <form id="loginForm">
          <label>Email<input id="loginEmail" type="email" required placeholder="you@example.com"></label>
          <label>Password<input id="loginPassword" type="password" required placeholder="••••••••"></label>
          <button class="primary-btn full" type="submit">Sign In</button>
        </form>
        <p class="switch-text">Don't have an account? <button id="showSignup" class="text-btn" type="button">Create account</button></p>
      </div>

      <div id="signupView" class="hidden">
        <h2>Create your account</h2>
        <p class="muted">Set up BizPlus for your business.</p>
        <form id="signupForm">
          <label>Full name<input id="signupName" required placeholder="Your name"></label>
          <label>Business name<input id="signupBusiness" required placeholder="Your business"></label>
          <label>Email<input id="signupEmail" type="email" required placeholder="you@example.com"></label>
          <label>Password<input id="signupPassword" type="password" minlength="6" required placeholder="Minimum 6 characters"></label>
          <label>Confirm password<input id="signupConfirm" type="password" minlength="6" required placeholder="Repeat password"></label>
          <button class="primary-btn full" type="submit">Create Account</button>
        </form>
        <p class="switch-text">Already have an account? <button id="showLogin" class="text-btn" type="button">Sign in</button></p>
      </div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
